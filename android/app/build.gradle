        buildConfigField "boolean", "RESTRICTED_SMS_CAPABLE", "false"
        buildConfigField "String", "APPROVED_DISTRIBUTION_CHANNEL", '""'
        buildConfigField "String", "APPROVED_INSTALLER_PACKAGE", '""'
        buildConfigField "String", "APPROVED_SIGNING_CERTIFICATE_SHA256", '""'
        buildConfigField "int", "MINIMUM_CERTIFIED_API", "0"
