/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

def releaseStorePath = System.getenv("BIRTHDAY_UPLOAD_STORE_FILE")
def releaseStorePassword = System.getenv("BIRTHDAY_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("BIRTHDAY_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = System.getenv("BIRTHDAY_UPLOAD_KEY_PASSWORD")
def releaseSigningCertificateSha256 = System.getenv("BIRTHDAY_SIGNING_CERT_SHA256")
    ?.replace(":", "")
    ?.trim()
    ?.toLowerCase(Locale.ROOT)
def releaseSigningValues = [
    releaseStorePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
    releaseSigningCertificateSha256,
]
def releaseSigningErrors = []
def actualSigningCertificateSha256 = null
if (!releaseSigningValues.every { value -> value != null && !value.isBlank() }) {
    releaseSigningErrors.add("all release signing variables are required")
} else if (!(releaseSigningCertificateSha256 ==~ /[0-9a-f]{64}/)) {
    releaseSigningErrors.add("the expected signing certificate digest is invalid")
} else {
    def releaseStoreFile = file(releaseStorePath)
    if (!releaseStoreFile.isFile() || releaseStoreFile.length() <= 0) {
        releaseSigningErrors.add("the release keystore is missing")
    } else {
        char[] storePasswordChars = releaseStorePassword.toCharArray()
        char[] keyPasswordChars = releaseKeyPassword.toCharArray()
        try {
            KeyStore keyStore = null
            for (String type : ["PKCS12", "JKS"]) {
                try {
                    def candidate = KeyStore.getInstance(type)
                    new FileInputStream(releaseStoreFile).withCloseable { stream ->
                        candidate.load(stream, storePasswordChars)
                    }
                    keyStore = candidate
                    break
                } catch (Exception ignored) {
                    keyStore = null
                }
            }
            if (keyStore == null || !keyStore.isKeyEntry(releaseKeyAlias)) {
                releaseSigningErrors.add("the release key entry cannot be verified")
            } else {
                def privateKey = keyStore.getKey(releaseKeyAlias, keyPasswordChars)
                def certificate = keyStore.getCertificate(releaseKeyAlias)
                if (!(privateKey instanceof java.security.PrivateKey) || certificate == null) {
                    releaseSigningErrors.add("the release alias is not a private signing-key entry")
                } else {
                    actualSigningCertificateSha256 = MessageDigest.getInstance("SHA-256")
                        .digest(certificate.encoded)
                        .collect { byte value -> String.format("%02x", value & 0xff) }
                        .join()
                    if (actualSigningCertificateSha256 != releaseSigningCertificateSha256) {
                        releaseSigningErrors.add("the release keystore certificate does not match the declared digest")
                    }
                }
            }
        } catch (Exception ignored) {
            releaseSigningErrors.add("the release key entry cannot be verified")
        } finally {
            Arrays.fill(storePasswordChars, (char) 0)
            Arrays.fill(keyPasswordChars, (char) 0)
        }
    }
}
def hasReleaseSigning = releaseSigningErrors.isEmpty()
def distributionEvidencePath = System.getenv("BIRTHDAY_DISTRIBUTION_EVIDENCE_FILE")
def distributionEvidenceFile = distributionEvidencePath == null || distributionEvidencePath.isBlank()
    ? null
    : file(distributionEvidencePath)
def distributionEvidenceDocument = null
if (distributionEvidenceFile?.isFile() &&
    distributionEvidenceFile.length() in 1..(64 * 1024)) {
    try {
        distributionEvidenceDocument = new JsonSlurper().parse(distributionEvidenceFile)
    } catch (Exception ignored) {
        distributionEvidenceDocument = null
    }
}
def expectedApplicationIds = [
    lab: "com.yashsomani.birthdayautopilot.lab",
    prod: "com.yashsomani.birthdayautopilot",
]
def evidenceTopLevelKeys = ["schemaVersion", "approvals"] as Set
def evidenceApprovalKeys = [
    "tier",
    "status",
    "applicationId",
    "versionCode",
    "channel",
    "installerPackage",
    "signingCertificateSha256",
    "minimumCertifiedApi",
    "maximumCertifiedApi",
    "smsPermissionPolicyApproved",
    "installerAllowlistVerified",
    "physicalSmsMatrixPassed",
    "telephonyStatePermissionApproved",
    "appCheckEnforced",
    "privacyMaterialsApproved",
    "playUploadApproved",
    "approvalReference",
    "certifiedDeviceMatrixReference",
    "carrierMatrixReference",
    "legalReviewReference",
    "approvedAt",
    "validUntil",
    "launchCountries",
] as Set
def safeEvidenceReference = { value ->
    value instanceof String &&
        value == value.trim() &&
        value ==~ /[A-Za-z0-9][A-Za-z0-9 ._:\/#-]{0,255}/
}
def validateDistributionEvidence = { String tier ->
    def errors = []
    def document = distributionEvidenceDocument
    if (!(document instanceof Map)) {
        return [approval: null, errors: ["evidence JSON is missing or malformed"]]
    }
    if (document.schemaVersion != 1) {
        errors.add("schemaVersion must be 1")
    }
    def unknownTopLevelKeys = document.keySet().findAll { !evidenceTopLevelKeys.contains(it) }
    if (!unknownTopLevelKeys.isEmpty()) errors.add("evidence contains unsupported fields")
    def approvals = document.approvals
    if (!(approvals instanceof Collection) || approvals.size() !in 1..2) {
        return [approval: null, errors: errors + ["approvals must contain one or two entries"]]
    }
    if (!approvals.every { it instanceof Map }) {
        return [approval: null, errors: errors + ["every approval must be an object"]]
    }
    def approvalTiers = approvals.collect { it.tier }
    if (approvalTiers.toSet().size() != approvalTiers.size()) {
        errors.add("approval tiers must be unique")
    }
    def matchingApprovals = approvals.findAll { it.tier == tier }
    def approval = matchingApprovals.size() == 1 ? matchingApprovals.single() : null
    if (!(approval instanceof Map)) {
        return [approval: null, errors: errors + ["${tier} approval is missing"]]
    }
    def unknownApprovalKeys = approval.keySet().findAll { !evidenceApprovalKeys.contains(it) }
    if (!unknownApprovalKeys.isEmpty()) errors.add("${tier} approval contains unsupported fields")

    if (approval.tier != tier) errors.add("${tier} tier does not match")
    if (approval.status != "approved") errors.add("${tier} status is not approved")
    if (approval.applicationId != expectedApplicationIds[tier]) {
        errors.add("${tier} applicationId does not match")
    }
    if (approval.versionCode != 1) errors.add("${tier} versionCode does not match")
    if (!(approval.channel in ["google-play", "managed-enterprise", "controlled-direct"])) {
        errors.add("${tier} channel is unsupported")
    }
    if (!(approval.installerPackage instanceof String) ||
        !(approval.installerPackage ==~ /[A-Za-z0-9_.]{3,255}/)) {
        errors.add("${tier} installer package is invalid")
    }
    if (approval.channel == "google-play" && approval.installerPackage != "com.android.vending") {
        errors.add("${tier} Google Play installer is invalid")
    }
    def evidenceCertificate = approval.signingCertificateSha256 instanceof String
        ? approval.signingCertificateSha256.replace(":", "").toLowerCase(Locale.ROOT)
        : ""
    if (!(evidenceCertificate ==~ /[0-9a-f]{64}/) ||
        evidenceCertificate != actualSigningCertificateSha256) {
        errors.add("${tier} signing certificate does not match")
    }
    if (!(approval.minimumCertifiedApi instanceof Number) ||
        !(approval.maximumCertifiedApi instanceof Number) ||
        approval.minimumCertifiedApi != 29 ||
        approval.maximumCertifiedApi < rootProject.ext.targetSdkVersion ||
        approval.maximumCertifiedApi > 37 ||
        approval.maximumCertifiedApi < approval.minimumCertifiedApi) {
        errors.add("${tier} certified API range is invalid")
    }
    [
        "smsPermissionPolicyApproved",
        "installerAllowlistVerified",
        "physicalSmsMatrixPassed",
        "telephonyStatePermissionApproved",
        "appCheckEnforced",
        "privacyMaterialsApproved",
    ].each { field ->
        if (approval[field] != true) errors.add("${tier} ${field} is not verified")
    }
    if (approval.channel == "google-play" && approval.playUploadApproved != true) {
        errors.add("${tier} Play upload approval is not verified")
    }
    if (approval.containsKey("playUploadApproved") &&
        !(approval.playUploadApproved instanceof Boolean)) {
        errors.add("${tier} Play upload approval has an invalid type")
    }
    if (!safeEvidenceReference(approval.approvalReference)) {
        errors.add("${tier} approval reference is missing")
    }
    [
        "certifiedDeviceMatrixReference",
        "carrierMatrixReference",
        "legalReviewReference",
    ].each { field ->
        if (!safeEvidenceReference(approval[field])) {
            errors.add("${tier} ${field} is missing")
        }
    }
    if (!(approval.launchCountries instanceof Collection) ||
        !approval.launchCountries.contains("IN") ||
        approval.launchCountries.toSet().size() != approval.launchCountries.size() ||
        !approval.launchCountries.every { it instanceof String && it ==~ /[A-Z]{2}/ }) {
        errors.add("${tier} launch countries are invalid or do not include IN")
    }
    try {
        if (!(approval.approvedAt instanceof String) || !approval.approvedAt.endsWith("Z") ||
            !(approval.validUntil instanceof String) || !approval.validUntil.endsWith("Z")) {
            throw new IllegalArgumentException("timestamps must be UTC")
        }
        def approvedAt = Instant.parse(approval.approvedAt as String)
        def validUntil = Instant.parse(approval.validUntil as String)
        def now = Instant.now()
        if (approvedAt.isAfter(now.plusSeconds(300))) {
            errors.add("${tier} approval timestamp is in the future")
        }
        if (!validUntil.isAfter(now)) errors.add("${tier} approval is expired")
        if (!validUntil.isAfter(approvedAt)) errors.add("${tier} approval validity is inverted")
        if (validUntil.isAfter(approvedAt.plusSeconds(366L * 24 * 60 * 60))) {
            errors.add("${tier} approval validity exceeds one year")
        }
    } catch (Exception ignored) {
        errors.add("${tier} approval timestamps are invalid")
    }

    [approval: errors.isEmpty() ? approval : null, errors: errors]
}
def labEvidence = validateDistributionEvidence("lab")
def prodEvidence = validateDistributionEvidence("prod")
def distributionEvidenceByTier = [lab: labEvidence, prod: prodEvidence]

// Inspect the resolved graph, not only the command line. This prevents aggregate
// tasks such as `assemble`, `build`, `assembleRelease`, and `bundleRelease` from
// bypassing the restricted-SMS release gate.
gradle.taskGraph.whenReady { graph ->
    def artifactTasksByTier = [
        lab: ["packagelabrelease", "packagelabreleasebundle", "signlabreleasebundle"],
        prod: ["packageprodrelease", "packageprodreleasebundle", "signprodreleasebundle"],
    ]
    def requestedRestrictedTiers = artifactTasksByTier.findAll { tier, artifactTaskNames ->
        graph.allTasks.any { task ->
            task.project == project && artifactTaskNames.contains(task.name.toLowerCase())
        }
    }.keySet()
    def missingFirebaseTiers = requestedRestrictedTiers.findAll { tier ->
        !file("src/${tier}/google-services.json").isFile()
    }
    def evidenceErrors = requestedRestrictedTiers.collectMany { tier ->
        distributionEvidenceByTier[tier].errors
    }
    def gateErrors = []
    if (!hasReleaseSigning) gateErrors.addAll(releaseSigningErrors)
    missingFirebaseTiers.each { tier ->
        gateErrors.add("${tier} Firebase configuration is missing")
    }
    gateErrors.addAll(evidenceErrors)

    if (!requestedRestrictedTiers.isEmpty() &&
        !gateErrors.isEmpty()) {
        throw new GradleException(
            "Restricted SMS release gates are incomplete. Configure certificate-bound signing, " +
            "valid structured distribution evidence, and the requested tier Firebase config. " +
            "Checks: ${gateErrors.unique().join('; ')}"
        )
    }
}

if (!hermesEnabled.toBoolean()) {
    throw new GradleException("Hermes is a pinned production invariant; the dynamic JSC fallback is disabled.")
