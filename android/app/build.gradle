apply plugin: "com.google.devtools.ksp"

// Firebase configuration is intentionally flavor-local. A generic/main/build-type file could
// silently connect the wrong application ID to the wrong project and is therefore rejected.
def firebaseApplicationIds = [
    dev: "com.yashsomani.birthdayautopilot.dev",
    staging: "com.yashsomani.birthdayautopilot.staging",
    lab: "com.yashsomani.birthdayautopilot.lab",
    prod: "com.yashsomani.birthdayautopilot",
]
def allowedFirebaseConfigFiles = firebaseApplicationIds.collectEntries { tier, applicationId ->
    [(tier): file("src/${tier}/google-services.json")]
}
def discoveredFirebaseConfigs = fileTree(projectDir) {
    include "**/google-services.json"
}.files
def unexpectedFirebaseConfigs = discoveredFirebaseConfigs.findAll { candidate ->
    !allowedFirebaseConfigFiles.values().any { allowed ->
        candidate.canonicalFile == allowed.canonicalFile
    }
}
if (!unexpectedFirebaseConfigs.isEmpty()) {
    throw new GradleException(
        "Firebase configuration must exist only at src/<dev|staging|lab|prod>/google-services.json; " +
        "generic, main, and build-type files are forbidden."
    )
}

def configuredFirebaseProjects = [:]
allowedFirebaseConfigFiles.each { tier, configFile ->
    if (!configFile.isFile()) return
    if (configFile.length() <= 0 || configFile.length() > 1024 * 1024) {
        throw new GradleException("${tier} Firebase configuration has an invalid size.")
    }
    def document
    try {
        document = new JsonSlurper().parse(configFile)
    } catch (Exception ignored) {
        throw new GradleException("${tier} Firebase configuration is malformed.")
    }
    def projectInfo = document instanceof Map ? document.project_info : null
    def projectNumber = projectInfo instanceof Map ? projectInfo.project_number?.toString() : null
    def projectId = projectInfo instanceof Map ? projectInfo.project_id?.toString() : null
    if (!(projectNumber ==~ /[0-9]{6,32}/) ||
        !(projectId ==~ /[a-z][a-z0-9-]{4,28}[a-z0-9]/)) {
        throw new GradleException("${tier} Firebase project identity is invalid.")
    }
    if (configuredFirebaseProjects.values().any { existing ->
        existing.projectId == projectId || existing.projectNumber == projectNumber
    }) {
        throw new GradleException("Firebase projects and project numbers cannot be shared across tiers.")
    }
    configuredFirebaseProjects[tier] = [projectId: projectId, projectNumber: projectNumber]

    def clients = document.client instanceof Collection ? document.client : []
    def matchingClients = clients.findAll { client ->
        client instanceof Map &&
            client.client_info instanceof Map &&
            client.client_info.android_client_info instanceof Map &&
            client.client_info.android_client_info.package_name == firebaseApplicationIds[tier]
    }
    if (matchingClients.size() != 1) {
        throw new GradleException(
            "${tier} Firebase configuration must contain exactly one client for ${firebaseApplicationIds[tier]}."
        )
    }
    def matchingClient = matchingClients.single()
    def mobileAppId = matchingClient.client_info.mobilesdk_app_id?.toString()
    if (!(mobileAppId ==~ /1:${projectNumber}:android:[0-9a-fA-F]+/)) {
        throw new GradleException("${tier} Firebase Android app ID does not match its project number.")
    }
    def oauthClients = matchingClient.oauth_client instanceof Collection
        ? matchingClient.oauth_client
        : []
    def webClients = oauthClients.findAll { oauth ->
        oauth instanceof Map &&
            oauth.client_type == 3 &&
            oauth.client_id?.toString() ==~ /[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com/
    }
    def androidClients = oauthClients.findAll { oauth ->
        oauth instanceof Map &&
            oauth.client_type == 1 &&
            oauth.android_info instanceof Map &&
            oauth.android_info.package_name == firebaseApplicationIds[tier] &&
            oauth.android_info.certificate_hash?.toString() ==~ /[0-9a-fA-F]{40}/
    }
    if (webClients.size() != 1 || androidClients.isEmpty()) {
        throw new GradleException(
            "${tier} Firebase configuration requires one Web OAuth client and at least one " +
            "certificate-bound Android OAuth client for its exact application ID."
        )
    }
    def apiKeys = matchingClient.api_key instanceof Collection ? matchingClient.api_key : []
    if (!apiKeys.any { key ->
        key instanceof Map && key.current_key?.toString() ==~ /AIza[A-Za-z0-9_-]{20,}/
    }) {
        throw new GradleException("${tier} Firebase configuration has no valid public application API key.")
    }
}

if (!configuredFirebaseProjects.isEmpty()) {
    // The Google Services plugin itself then fails a requested flavor that lacks its own exact
    // file; it cannot fall back to another flavor because no shared location is permitted above.
    apply plugin: "com.google.gms.google-services"
}

