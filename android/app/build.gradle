def enableProguardInReleaseBuilds = true

def releaseStorePath = System.getenv("BIRTHDAY_UPLOAD_STORE_FILE")
def releaseStorePassword = System.getenv("BIRTHDAY_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("BIRTHDAY_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = System.getenv("BIRTHDAY_UPLOAD_KEY_PASSWORD")
def releaseSigningCertificateSha256 = System.getenv("BIRTHDAY_SIGNING_CERT_SHA256")
    ?.replace(":", "")
    ?.trim()
    ?.toLowerCase(Locale.ROOT)
def releaseSigningValues = [
    releaseStorePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
    releaseSigningCertificateSha256,
]
def releaseSigningErrors = []
def actualSigningCertificateSha256 = null
if (!releaseSigningValues.every { value -> value != null && !value.isBlank() }) {
    releaseSigningErrors.add("all release signing variables are required")
} else if (!(releaseSigningCertificateSha256 ==~ /[0-9a-f]{64}/)) {
    releaseSigningErrors.add("the expected signing certificate digest is invalid")
} else {
    def releaseStoreFile = file(releaseStorePath)
    if (!releaseStoreFile.isFile() || releaseStoreFile.length() <= 0) {
        releaseSigningErrors.add("the release keystore is missing")
    } else {
        char[] storePasswordChars = releaseStorePassword.toCharArray()
        char[] keyPasswordChars = releaseKeyPassword.toCharArray()
        try {
            KeyStore keyStore = null
            for (String type : ["PKCS12", "JKS"]) {
                try {
                    def candidate = KeyStore.getInstance(type)
                    new FileInputStream(releaseStoreFile).withCloseable { stream ->
                        candidate.load(stream, storePasswordChars)
                    }
                    keyStore = candidate
                    break
                } catch (Exception ignored) {
                    keyStore = null
                }
            }
            if (keyStore == null || !keyStore.isKeyEntry(releaseKeyAlias)) {
                releaseSigningErrors.add("the release key entry cannot be verified")
            } else {
                def privateKey = keyStore.getKey(releaseKeyAlias, keyPasswordChars)
                def certificate = keyStore.getCertificate(releaseKeyAlias)
                if (!(privateKey instanceof java.security.PrivateKey) || certificate == null) {
                    releaseSigningErrors.add("the release alias is not a private signing-key entry")
                } else {
                    actualSigningCertificateSha256 = MessageDigest.getInstance("SHA-256")
                        .digest(certificate.encoded)
                        .collect { byte value -> String.format("%02x", value & 0xff) }
                        .join()
                    if (actualSigningCertificateSha256 != releaseSigningCertificateSha256) {
                        releaseSigningErrors.add("the release keystore certificate does not match the declared digest")
                    }
                }
            }
        } catch (Exception ignored) {
            releaseSigningErrors.add("the release key entry cannot be verified")
        } finally {
            Arrays.fill(storePasswordChars, (char) 0)
            Arrays.fill(keyPasswordChars, (char) 0)
        }
    }
}
def hasReleaseSigning = releaseSigningErrors.isEmpty()
def releaseVersionCode = 1
def releaseBaseVersionName = "1.0"
def restrictedVersionNames = [
    lab: "${releaseBaseVersionName}-lab",
    prod: releaseBaseVersionName,
]
def distributionEvidencePath = System.getenv("BIRTHDAY_DISTRIBUTION_EVIDENCE_FILE")
def distributionEvidenceSignaturePath =
    System.getenv("BIRTHDAY_DISTRIBUTION_EVIDENCE_SIGNATURE_FILE")
def distributionAuthorityPublicKeyPath =
    System.getenv("BIRTHDAY_DISTRIBUTION_AUTHORITY_PUBLIC_KEY_FILE")
def distributionEvidenceRootPath =
    System.getenv("BIRTHDAY_DISTRIBUTION_EVIDENCE_ROOT")
def expectedApplicationIds = [
    lab: "com.yashsomani.birthdayautopilot.lab",
    prod: "com.yashsomani.birthdayautopilot",
]

// This is intentionally the same authority and semantic validator used by the standalone APK
// verifier. The JSON is never trusted merely because it exists: the exact file bytes need a raw
// detached Ed25519 signature whose public key matches the clean, tracked repository pin.
def validateDistributionEvidence = { String tier ->
    def authorityInputs = [
        evidence: distributionEvidencePath,
        signature: distributionEvidenceSignaturePath,
        publicKey: distributionAuthorityPublicKeyPath,
    ]
    def missingInputs = authorityInputs.findAll { ignored, value ->
        value == null || value.isBlank() || !file(value).isFile()
    }.keySet().toList()
    if (distributionEvidenceRootPath == null ||
        distributionEvidenceRootPath.isBlank() ||
        !file(distributionEvidenceRootPath).isDirectory()) {
        missingInputs.add("evidenceRoot")
    }
    if (!missingInputs.isEmpty()) {
        return [
            approval: null,
            errors: ["${tier} signed evidence inputs are missing: ${missingInputs.join(', ')}"],
        ]
    }
    if (actualSigningCertificateSha256 == null) {
        return [
            approval: null,
            errors: ["${tier} release certificate is unavailable for evidence validation"],
        ]
    }

    try {
        def validation = providers.exec {
            commandLine(
                "node",
                rootProject.file("../tools/validate-distribution-evidence.mjs").absolutePath,
                "--file",
                file(distributionEvidencePath).absolutePath,
                "--signature",
                file(distributionEvidenceSignaturePath).absolutePath,
                "--public-key",
                file(distributionAuthorityPublicKeyPath).absolutePath,
                "--evidence-root",
                file(distributionEvidenceRootPath).absolutePath,
                "--tier",
                tier,
                "--package",
                expectedApplicationIds[tier],
                "--version-code",
                releaseVersionCode.toString(),
                "--version-name",
                restrictedVersionNames[tier],
                "--artifact-mode",
                "prepackage",
                "--artifact-signing-certificate",
                actualSigningCertificateSha256,
                "--output",
                "json",
            )
            ignoreExitValue = true
        }
        def result = validation.result.get()
        if (result.exitValue != 0) {
            def diagnostic = validation.standardError.asText.get().readLines()
                .collect { it.replaceFirst(/^FAIL /, "") }
                .findAll { !it.isBlank() }
            return [
                approval: null,
                errors: diagnostic.isEmpty()
                    ? ["${tier} signed evidence validation failed"]
                    : diagnostic.collect { "${tier}: ${it}" },
            ]
        }
        def verified = new JsonSlurper().parseText(validation.standardOutput.asText.get())
        if (!(verified instanceof Map) || !(verified.approval instanceof Map)) {
            return [
                approval: null,
                errors: ["${tier} signed evidence validator returned invalid output"],
            ]
        }
        return [approval: verified.approval, errors: []]
    } catch (Exception ignored) {
        return [
            approval: null,
            errors: ["${tier} signed evidence validator could not run"],
        ]
    }
}
def labEvidence = validateDistributionEvidence("lab")
def prodEvidence = validateDistributionEvidence("prod")
def distributionEvidenceByTier = [lab: labEvidence, prod: prodEvidence]

// Inspect the resolved graph, not only the command line. This prevents aggregate
// tasks such as `assemble`, `build`, `assembleRelease`, and `bundleRelease` from
// bypassing the restricted-SMS release gate.
gradle.taskGraph.whenReady { graph ->
    def artifactTasksByTier = [
        lab: ["packagelabrelease", "packagelabreleasebundle", "signlabreleasebundle"],
        prod: ["packageprodrelease", "packageprodreleasebundle", "signprodreleasebundle"],
    ]
    def apkArtifactTaskByTier = [
        lab: "packagelabrelease",
        prod: "packageprodrelease",
    ]
    def bundleArtifactTasksByTier = [
        lab: ["packagelabreleasebundle", "signlabreleasebundle"],
        prod: ["packageprodreleasebundle", "signprodreleasebundle"],
    ]
    def requestedRestrictedTiers = artifactTasksByTier.findAll { tier, artifactTaskNames ->
        graph.allTasks.any { task ->
            task.project == project && artifactTaskNames.contains(task.name.toLowerCase())
        }
    }.keySet()
    def missingFirebaseTiers = requestedRestrictedTiers.findAll { tier ->
        !file("src/${tier}/google-services.json").isFile()
    }
    def evidenceErrors = requestedRestrictedTiers.collectMany { tier ->
        distributionEvidenceByTier[tier].errors
    }
    def artifactChannelErrors = requestedRestrictedTiers.collectMany { tier ->
        def approval = distributionEvidenceByTier[tier].approval
        if (approval == null) return []
        def taskNames = graph.allTasks.findAll { task -> task.project == project }
            .collect { task -> task.name.toLowerCase() }
        def buildsApk = taskNames.contains(apkArtifactTaskByTier[tier])
        def buildsBundle = bundleArtifactTasksByTier[tier].any { taskNames.contains(it) }
        if (approval.channel == "google-play" && buildsApk) {
            return ["${tier}: Google Play approval authorizes only an upload-key-signed AAB, never an upload-key-signed APK"]
        }
        if (approval.channel != "google-play" && buildsBundle) {
            return ["${tier}: direct or managed approval authorizes only an APK signed by the installed-app key"]
        }
        return []
    }
    def gateErrors = []
    if (!hasReleaseSigning) gateErrors.addAll(releaseSigningErrors)
    missingFirebaseTiers.each { tier ->
        gateErrors.add("${tier} Firebase configuration is missing")
    }
    gateErrors.addAll(evidenceErrors)
    gateErrors.addAll(artifactChannelErrors)

    if (!requestedRestrictedTiers.isEmpty() &&
        !gateErrors.isEmpty()) {
        throw new GradleException(
            "Restricted SMS release gates are incomplete. Configure certificate-bound signing, " +
            "authority-signed structured distribution evidence, its detached signature and " +
            "pinned authority public key, its exact supporting-evidence root, plus the requested tier Firebase config. " +
            "Checks: ${gateErrors.unique().join('; ')}"
        )
    }
}

