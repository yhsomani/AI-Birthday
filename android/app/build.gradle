                ? '""'
                : '"' + labEvidence.approval.installerPackage + '"'
            buildConfigField "String", "APPROVED_SIGNING_CERTIFICATE_SHA256", labEvidence.approval == null
                ? '""'
                : '"' + actualSigningCertificateSha256 + '"'
            buildConfigField "int", "MINIMUM_CERTIFIED_API", labEvidence.approval == null
                ? "0"
                : labEvidence.approval.minimumCertifiedApi.toString()
            buildConfigField "int", "MAXIMUM_CERTIFIED_API", labEvidence.approval == null
                ? "0"
                : labEvidence.approval.maximumCertifiedApi.toString()
            buildConfigField "long", "DISTRIBUTION_EVIDENCE_EXPIRES_AT_SECONDS", labEvidence.approval == null
                ? "0L"
                : Instant.parse(labEvidence.approval.validUntil as String).epochSecond + "L"
        }
        prod {
            dimension "environment"
            buildConfigField "String", "APP_ENV", '"prod"'
            buildConfigField "boolean", "RESTRICTED_SMS_CAPABLE", prodEvidence.approval == null ? "false" : "true"
            buildConfigField "String", "APPROVED_DISTRIBUTION_CHANNEL", prodEvidence.approval == null
                ? '""'
                : '"' + prodEvidence.approval.channel + '"'
            buildConfigField "String", "APPROVED_INSTALLER_PACKAGE", prodEvidence.approval == null
                ? '""'
                : '"' + prodEvidence.approval.installerPackage + '"'
            buildConfigField "String", "APPROVED_SIGNING_CERTIFICATE_SHA256", prodEvidence.approval == null
                ? '""'
                : '"' + actualSigningCertificateSha256 + '"'
            buildConfigField "int", "MINIMUM_CERTIFIED_API", prodEvidence.approval == null
                ? "0"
                : prodEvidence.approval.minimumCertifiedApi.toString()
            buildConfigField "int", "MAXIMUM_CERTIFIED_API", prodEvidence.approval == null
                ? "0"
                : prodEvidence.approval.maximumCertifiedApi.toString()
            buildConfigField "long", "DISTRIBUTION_EVIDENCE_EXPIRES_AT_SECONDS", prodEvidence.approval == null
                ? "0L"
                : Instant.parse(prodEvidence.approval.validUntil as String).epochSecond + "L"
        }
    }

    buildFeatures {
