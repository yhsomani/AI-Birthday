    }

    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile = file(releaseStorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled = enableProguardInReleaseBuilds
            shrinkResources = enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        def environment = variantBuilder.productFlavors.find { flavor ->
            flavor.first == "environment"
        }?.second
        if (environment == "smoke") {
            // The production-path smoke host has no native test surface. It is
            // exercised as an installed app by the shared Maestro flow, so
            // generating host/device test variants would create unreviewed,
            // unlocked dependency configurations for code that cannot run.
            variantBuilder.enableUnitTest = false
            variantBuilder.enableAndroidTest = false
        }
        if ((environment == "e2e" || environment == "smoke") &&
            variantBuilder.buildType != "debug") {
            variantBuilder.enable = false
        } else if ((environment == "lab" || environment == "prod") &&
            variantBuilder.buildType != "release") {
            variantBuilder.enable = false
        }
    }
}

def requestedReactEntryFile = System.getenv("ENTRY_FILE")
    ?.replace('\\', '/')
    ?.replaceFirst(/^\.\//, '')
if (requestedReactEntryFile == "e2e/index.js") {
    // ENTRY_FILE is a process-wide React Native Gradle input. Never let an
    // aggregate, restricted, or release graph reuse the fixture entry.
    gradle.taskGraph.whenReady { graph ->
        def forbiddenFixtureBundleGraph = graph.allTasks.any { task ->
            if (task.project != project) return false
            def taskName = task.name.toLowerCase(Locale.ROOT)
            taskName.contains("lab") || taskName.contains("prod") || taskName.contains("release")
        }
        if (forbiddenFixtureBundleGraph) {
            throw new GradleException(
                "The E2E React Native entry is authorized only for the e2eDebug fixture variant."
            )
        }
    }
}

