appId: ${PRODUCTION_SMOKE_APP_ID}
name: Production entry, native decoding and primary navigation
tags:
  - production-smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: live-app-shell
    timeout: 120000
- assertVisible:
    id: live-app-shell
- assertVisible:
    id: live-home-screen
- scrollUntilVisible:
    element:
      id: live-home-activity
    direction: DOWN
- tapOn:
    id: live-home-activity
- assertVisible:
    id: live-activity-screen
- tapOn:
    id: live-activity-smoke.activity.1
- assertVisible:
    id: live-activity-detail-screen
- tapOn:
    id: live-activity-detail-back
- assertVisible:
    id: live-activity-screen
- tapOn:
    id: live-activity-back
- assertVisible:
    id: live-home-screen
- scrollUntilVisible:
    element:
      id: live-home-attention
    direction: DOWN
- tapOn:
    id: live-home-attention
- assertVisible:
    id: live-attention-screen
- tapOn:
    id: live-attention-back
- assertVisible:
    id: live-home-screen
- tapOn:
    id: live-tab-people
- assertVisible:
    id: live-people-screen
- tapOn:
    id: live-people-filter-ready
- assertVisible:
    text: '.*(No one is ready to set up|कोई व्यक्ति सेटअप के लिए तैयार नहीं है).*'
- tapOn:
    id: live-people-search
- inputText: smoke-no-match
- hideKeyboard
- assertVisible:
    text: '.*(No people match this search|इस खोज से कोई व्यक्ति नहीं मिला).*'
- tapOn:
    id: live-people-search
- eraseText: 14
- hideKeyboard
- tapOn:
    id: live-people-filter-all
- tapOn:
    id: live-tab-settings
- assertVisible:
    id: live-settings-screen
- scrollUntilVisible:
    element:
      id: live-settings-message
    direction: DOWN
- tapOn:
    id: live-settings-message
- assertVisible:
    id: live-message-screen
- tapOn:
    id: live-message-back
- assertVisible:
    id: live-settings-screen
- scrollUntilVisible:
    element:
      id: live-settings-schedule
    direction: DOWN
- tapOn:
    id: live-settings-schedule
- assertVisible:
    id: live-schedule-screen
- tapOn:
    id: live-schedule-back
- assertVisible:
    id: live-settings-screen
- scrollUntilVisible:
    element:
      id: live-settings-automation
    direction: DOWN
- tapOn:
    id: live-settings-automation
- assertVisible:
    id: live-automation-screen
- tapOn:
    id: live-automation-back
- assertVisible:
    id: live-settings-screen
- scrollUntilVisible:
    element:
      id: live-settings-privacy
    direction: DOWN
- tapOn:
    id: live-settings-privacy
- assertVisible:
    id: live-privacy-screen
- tapOn:
    id: live-privacy-back
- assertVisible:
    id: live-settings-screen
- scrollUntilVisible:
    element:
      id: live-settings-help-legal
    direction: DOWN
- tapOn:
    id: live-settings-help-legal
- assertVisible:
    id: live-help-legal-screen
- tapOn:
    id: live-help-diagnostics
- assertVisible:
    id: live-diagnostics-screen
- tapOn:
    id: live-diagnostics-back
- assertVisible:
    id: live-help-legal-screen
- tapOn:
    id: live-help-back
- assertVisible:
    id: live-settings-screen
- tapOn:
    id: live-tab-home
- assertVisible:
    id: live-home-screen
