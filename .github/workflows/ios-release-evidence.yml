name: iOS signed artifact pipeline (candidate is not release)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a protected candidate or verify already-built exact artifacts
        required: true
        type: choice
        options:
          - build-signed-candidate-not-release
          - verify-authority-approved-artifacts
      marketing_version:
        description: Candidate CFBundleShortVersionString (build operation only)
        required: false
        type: string
      build_number:
        description: Candidate CFBundleVersion (build operation only)
        required: false
        type: string
      candidate_run_id:
        description: Run containing ios-signed-candidate-not-release (verify operation only)
        required: false
        type: string
      supporting_evidence_run_id:
        description: Run containing ios-release-supporting-evidence (verify operation only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    name: Signed candidate is not a releasable artifact
    if: inputs.operation == 'build-signed-candidate-not-release'
    runs-on: macos-26
    timeout-minutes: 75
    environment: ios-production-signing-candidate
    env:
      BUNDLE_FROZEN: 'true'
      COCOAPODS_DISABLE_STATS: 'true'
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      IOS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12_BASE64 }}
      IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
      IOS_RELEASE_HISTORY_BASE64: ${{ secrets.IOS_RELEASE_HISTORY_BASE64 }}
      IOS_RELEASE_HISTORY_SIGNATURE_BASE64: ${{ secrets.IOS_RELEASE_HISTORY_SIGNATURE_BASE64 }}
      DISTRIBUTION_AUTHORITY_PUBLIC_KEY_BASE64: ${{ secrets.DISTRIBUTION_AUTHORITY_PUBLIC_KEY_BASE64 }}
      IOS_FIREBASE_PROJECT_ID: ${{ secrets.IOS_FIREBASE_PROJECT_ID }}
      IOS_GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.IOS_GOOGLE_REVERSED_CLIENT_ID }}
      IOS_PRIVACY_REVIEW_APPROVED: ${{ secrets.IOS_PRIVACY_REVIEW_APPROVED }}
      INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
      INPUT_BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Set up pinned Ruby and Bundler
        uses: ruby/setup-ruby@ec02537da5712d66d4d50a0f33b7eb52773b5ed1 # v1
        with:
          bundler-cache: true

      - name: Fail closed unless protected signing, provider, and review inputs exist
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            IOS_SIGNING_CERTIFICATE_P12_BASE64 \
            IOS_SIGNING_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 \
            IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 \
            IOS_EXPORT_OPTIONS_PLIST_BASE64 \
            IOS_RELEASE_HISTORY_BASE64 \
            IOS_RELEASE_HISTORY_SIGNATURE_BASE64 \
            DISTRIBUTION_AUTHORITY_PUBLIC_KEY_BASE64 \
            IOS_FIREBASE_PROJECT_ID \
            IOS_GOOGLE_REVERSED_CLIENT_ID \
            IOS_PRIVACY_REVIEW_APPROVED; do
            test -n "${!name:-}" || { echo "Missing protected input: $name" >&2; exit 1; }
          done
          test "$IOS_PRIVACY_REVIEW_APPROVED" = YES
          [[ "$INPUT_MARKETING_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,63}$ ]]
          [[ "$INPUT_BUILD_NUMBER" =~ ^[1-9][0-9]{0,17}$ ]]
          test "$(node --version)" = v24.18.0
          test "$(npm --version)" = 11.6.0
          test "$(ruby -e 'print RUBY_VERSION')" = 3.4.10
          test "$(bundle --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1)" = 4.0.15
          test "$(bundle exec pod --version)" = 1.16.2
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.5'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.5

      - name: Decode protected inputs and validate signing coordinates
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          protected="$RUNNER_TEMP/ios-protected-inputs"
          mkdir -m 700 "$protected"
          printf '%s' "$IOS_SIGNING_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$protected/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$protected/distribution.mobileprovision"
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | /usr/bin/base64 -D > "$protected/GoogleService-Info.plist"
          printf '%s' "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | /usr/bin/base64 -D > "$protected/ExportOptions.plist"
          printf '%s' "$IOS_RELEASE_HISTORY_BASE64" | /usr/bin/base64 -D > "$protected/release-history.json"
          printf '%s' "$IOS_RELEASE_HISTORY_SIGNATURE_BASE64" | /usr/bin/base64 -D > "$protected/release-history.sig"
          printf '%s' "$DISTRIBUTION_AUTHORITY_PUBLIC_KEY_BASE64" | /usr/bin/base64 -D > "$protected/release-authority-public.pem"
          chmod 600 "$protected"/*

          /usr/bin/security cms -D -i "$protected/distribution.mobileprovision" -o "$protected/profile.plist"
          /usr/bin/plutil -lint "$protected/profile.plist" "$protected/ExportOptions.plist" "$protected/GoogleService-Info.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$protected/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$protected/profile.plist")
          team_id=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$protected/profile.plist")
          method=$(/usr/libexec/PlistBuddy -c 'Print :method' "$protected/ExportOptions.plist")
          signing_style=$(/usr/libexec/PlistBuddy -c 'Print :signingStyle' "$protected/ExportOptions.plist")
          export_team=$(/usr/libexec/PlistBuddy -c 'Print :teamID' "$protected/ExportOptions.plist")
          export_profile=$(/usr/libexec/PlistBuddy -c 'Print :provisioningProfiles:com.yashsomani.birthdayautopilot' "$protected/ExportOptions.plist")
          [[ "$team_id" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$profile_uuid" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]
          [[ "$profile_name" =~ ^[A-Za-z0-9][A-Za-z0-9._+\ -]{0,127}$ ]]
          test "$method" = app-store-connect
          test "$signing_style" = manual
          test "$export_team" = "$team_id"
          if [ "$export_profile" != "$profile_name" ] && [ "${export_profile^^}" != "${profile_uuid^^}" ]; then
            echo 'ExportOptions provisioning profile does not match the protected profile' >&2
            exit 1
          fi
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "team_id=$team_id" >> "$GITHUB_OUTPUT"
          echo "protected=$protected" >> "$GITHUB_OUTPUT"

      - name: Install locked mobile and iOS dependency graphs
        run: |
          npm ci
          npm run codegen:check
          npm run ios:pods
          npm run doctor:ios

      - name: Install ephemeral Apple signing identity and profile
        shell: bash
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          PROTECTED: ${{ steps.signing.outputs.protected }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/birthday-release.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"
          printf '%s' "$keychain_password" > "$RUNNER_TEMP/keychain-password"
          chmod 600 "$RUNNER_TEMP/keychain-password"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$PROTECTED/distribution.p12" \
            -k "$keychain" \
            -P "$IOS_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          /usr/bin/security list-keychains -d user -s \
            "$keychain" \
            "$HOME/Library/Keychains/login.keychain-db"
          profile_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_directory"
          cp "$PROTECTED/distribution.mobileprovision" "$profile_directory/$PROFILE_UUID.mobileprovision"

      - name: Archive and export a signed candidate
        shell: bash
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          PROTECTED: ${{ steps.signing.outputs.protected }}
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/release-evidence/ios-signed-candidate"
          archive="$output/BirthdayAutopilot.xcarchive"
          export_directory="$output/export"
          mkdir -p "$output" "$export_directory" ios/Config/prod
          cp "$PROTECTED/GoogleService-Info.plist" ios/Config/prod/GoogleService-Info.plist
          source_revision=$(git rev-parse --verify HEAD)
          xcodebuild \
            -workspace ios/BirthdayAutopilot.xcworkspace \
            -scheme BirthdayAutopilot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            MARKETING_VERSION="$INPUT_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$INPUT_BUILD_NUMBER" \
            BIRTHDAY_SOURCE_REVISION="$source_revision" \
            BIRTHDAY_FIREBASE_PROJECT_ID="$IOS_FIREBASE_PROJECT_ID" \
            BIRTHDAY_GOOGLE_REVERSED_CLIENT_ID="$IOS_GOOGLE_REVERSED_CLIENT_ID" \
            BIRTHDAY_PRIVACY_REVIEW_APPROVED=YES \
            BIRTHDAY_IOS_RELEASE_HISTORY_FILE="$PROTECTED/release-history.json" \
            BIRTHDAY_IOS_RELEASE_HISTORY_SIGNATURE_FILE="$PROTECTED/release-history.sig" \
            BIRTHDAY_DISTRIBUTION_AUTHORITY_PUBLIC_KEY_FILE="$PROTECTED/release-authority-public.pem" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive
          xcodebuild \
            -exportArchive \
            -archivePath "$archive" \
            -exportPath "$export_directory" \
            -exportOptionsPlist "$PROTECTED/ExportOptions.plist"
          ipa_count=$(find "$export_directory" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')
          test "$ipa_count" = 1
          ipa=$(find "$export_directory" -maxdepth 1 -type f -name '*.ipa' -print)
          cp "$ipa" "$output/BirthdayAutopilot.ipa"
          cp "$PROTECTED/ExportOptions.plist" "$output/ExportOptions.plist"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$archive" \
            "$output/BirthdayAutopilot.xcarchive.zip"
          /usr/bin/unzip -t "$output/BirthdayAutopilot.xcarchive.zip"

      - name: Generate candidate-only supply-chain and provenance evidence
        shell: bash
        run: |
          set -euo pipefail
          output=release-evidence/ios-signed-candidate
          cp package-lock.json "$output/Mobile-package-lock.json"
          cp Gemfile.lock "$output/Gemfile.lock"
          cp ios/Podfile.lock "$output/Podfile.lock"
          npm run ios:release:inspect -- \
            --archive "$output/BirthdayAutopilot.xcarchive" \
            --ipa "$output/BirthdayAutopilot.ipa" \
            --export-options "$output/ExportOptions.plist" \
            --report "$output/candidate-observation-not-release.json"
          npm sbom --sbom-format=cyclonedx > "$output/mobile.cdx.json"
          node tools/generate-native-sbom.mjs \
            --kind cocoapods \
            --lock ios/Podfile.lock \
            --output "$output/ios-native.cdx.json" \
            --application-name Birthday-Autopilot-iOS \
            --version "$INPUT_MARKETING_VERSION"
          node tools/scan-native-vulnerabilities.mjs \
            --dependency-set \
              ios-cocoapods \
              cocoapods \
              ios/Podfile.lock \
              "$output/ios-native.cdx.json" \
            --output "$output/ios-native-osv.json"
          cp tools/cocoapods-osv-source-map.json "$output/cocoapods-osv-source-map.json"
          cp tools/native-advisory-exceptions.json "$output/native-advisory-exceptions.json"
          npm audit --audit-level=high --json > "$output/npm-audit.json"
          node tools/verify-javascript-licenses.mjs \
            --output "$output/javascript-licenses.json"
          node tools/create-evidence-manifest.mjs \
            --base . \
            --label ios-signed-candidate-not-release \
            --output "$output/candidate-manifest.json" \
            "$output/Mobile-package-lock.json" \
            "$output/Gemfile.lock" \
            "$output/Podfile.lock" \
            "$output/BirthdayAutopilot.xcarchive" \
            "$output/BirthdayAutopilot.xcarchive.zip" \
            "$output/BirthdayAutopilot.ipa" \
            "$output/ExportOptions.plist" \
            "$output/candidate-observation-not-release.json" \
            "$output/mobile.cdx.json" \
            "$output/ios-native.cdx.json" \
            "$output/ios-native-osv.json" \
            "$output/cocoapods-osv-source-map.json" \
            "$output/native-advisory-exceptions.json" \
            "$output/npm-audit.json" \
            "$output/javascript-licenses.json"
          rm -rf "$output/BirthdayAutopilot.xcarchive"

      - name: Retain signed candidate for separate authority review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-signed-candidate-not-release
          if-no-files-found: error
          retention-days: 14
          path: |
            release-evidence/ios-signed-candidate/BirthdayAutopilot.xcarchive.zip
            release-evidence/ios-signed-candidate/BirthdayAutopilot.ipa
            release-evidence/ios-signed-candidate/ExportOptions.plist
            release-evidence/ios-signed-candidate/candidate-observation-not-release.json
            release-evidence/ios-signed-candidate/mobile.cdx.json
            release-evidence/ios-signed-candidate/ios-native.cdx.json
            release-evidence/ios-signed-candidate/ios-native-osv.json
            release-evidence/ios-signed-candidate/cocoapods-osv-source-map.json
            release-evidence/ios-signed-candidate/native-advisory-exceptions.json
            release-evidence/ios-signed-candidate/npm-audit.json
            release-evidence/ios-signed-candidate/javascript-licenses.json
            release-evidence/ios-signed-candidate/candidate-manifest.json
            release-evidence/ios-signed-candidate/Mobile-package-lock.json
            release-evidence/ios-signed-candidate/Gemfile.lock
            release-evidence/ios-signed-candidate/Podfile.lock

      - name: Remove ephemeral signing and provider material
        if: always()
        shell: bash
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          keychain="$RUNNER_TEMP/birthday-release.keychain-db"
          /usr/bin/security delete-keychain "$keychain" 2>/dev/null || true
          /usr/bin/security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -rf "$RUNNER_TEMP/ios-protected-inputs" "$RUNNER_TEMP/keychain-password"
          rm -f ios/Config/prod/GoogleService-Info.plist

  verify-release:
    name: Verify authority-approved exact archive and IPA
    if: inputs.operation == 'verify-authority-approved-artifacts'
    runs-on: macos-26
    timeout-minutes: 30
    environment: ios-production-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      IOS_RELEASE_EVIDENCE_BASE64: ${{ secrets.IOS_RELEASE_EVIDENCE_BASE64 }}
      IOS_RELEASE_EVIDENCE_SIGNATURE_BASE64: ${{ secrets.IOS_RELEASE_EVIDENCE_SIGNATURE_BASE64 }}
      DISTRIBUTION_AUTHORITY_PUBLIC_KEY_BASE64: ${{ secrets.DISTRIBUTION_AUTHORITY_PUBLIC_KEY_BASE64 }}
      INPUT_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      INPUT_SUPPORTING_EVIDENCE_RUN_ID: ${{ inputs.supporting_evidence_run_id }}

    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Fail closed unless exact candidate and authority evidence are supplied
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$INPUT_SUPPORTING_EVIDENCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test -n "$IOS_RELEASE_EVIDENCE_BASE64"
          test -n "$IOS_RELEASE_EVIDENCE_SIGNATURE_BASE64"
          test -n "$DISTRIBUTION_AUTHORITY_PUBLIC_KEY_BASE64"
          test "$(node --version)" = v24.18.0
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.5'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.5

      - name: Download exact candidate and supporting evidence runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/supporting-evidence"
          gh run download "$INPUT_CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ios-signed-candidate-not-release \
            --dir "$RUNNER_TEMP/candidate"
          gh run download "$INPUT_SUPPORTING_EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ios-release-supporting-evidence \
            --dir "$RUNNER_TEMP/supporting-evidence"

      - name: Decode authority-signed final evidence and archive
        shell: bash
        run: |
          set -euo pipefail
          protected="$RUNNER_TEMP/final-evidence-inputs"
          mkdir -m 700 "$protected" "$RUNNER_TEMP/archive"
          printf '%s' "$IOS_RELEASE_EVIDENCE_BASE64" | /usr/bin/base64 -D > "$protected/ios-release-evidence.json"
          printf '%s' "$IOS_RELEASE_EVIDENCE_SIGNATURE_BASE64" | /usr/bin/base64 -D > "$protected/ios-release-evidence.sig"
          printf '%s' "$DISTRIBUTION_AUTHORITY_PUBLIC_KEY_BASE64" | /usr/bin/base64 -D > "$protected/release-authority-public.pem"
          chmod 600 "$protected"/*
          test -f "$RUNNER_TEMP/candidate/BirthdayAutopilot.xcarchive.zip"
          test -f "$RUNNER_TEMP/candidate/BirthdayAutopilot.ipa"
          test -f "$RUNNER_TEMP/candidate/ExportOptions.plist"
          /usr/bin/unzip -t "$RUNNER_TEMP/candidate/BirthdayAutopilot.xcarchive.zip"
          /usr/bin/ditto -x -k \
            "$RUNNER_TEMP/candidate/BirthdayAutopilot.xcarchive.zip" \
            "$RUNNER_TEMP/archive"
          archive_count=$(find "$RUNNER_TEMP/archive" -maxdepth 1 -type d -name '*.xcarchive' | wc -l | tr -d ' ')
          test "$archive_count" = 1

      - name: Verify exact signed artifacts and all referenced evidence
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find "$RUNNER_TEMP/archive" -maxdepth 1 -type d -name '*.xcarchive' -print)
          mkdir -p release-evidence/ios-production-release
          npm run ios:release:verify -- \
            --archive "$archive" \
            --ipa "$RUNNER_TEMP/candidate/BirthdayAutopilot.ipa" \
            --export-options "$RUNNER_TEMP/candidate/ExportOptions.plist" \
            --evidence "$RUNNER_TEMP/final-evidence-inputs/ios-release-evidence.json" \
            --signature "$RUNNER_TEMP/final-evidence-inputs/ios-release-evidence.sig" \
            --public-key "$RUNNER_TEMP/final-evidence-inputs/release-authority-public.pem" \
            --evidence-root "$RUNNER_TEMP/supporting-evidence" \
            --report release-evidence/ios-production-release/verification-report.json
          cp "$RUNNER_TEMP/final-evidence-inputs/ios-release-evidence.json" release-evidence/ios-production-release/
          cp "$RUNNER_TEMP/final-evidence-inputs/ios-release-evidence.sig" release-evidence/ios-production-release/
          cp "$RUNNER_TEMP/final-evidence-inputs/release-authority-public.pem" release-evidence/ios-production-release/
          cp "$RUNNER_TEMP/candidate/BirthdayAutopilot.xcarchive.zip" release-evidence/ios-production-release/
          cp "$RUNNER_TEMP/candidate/BirthdayAutopilot.ipa" release-evidence/ios-production-release/
          cp "$RUNNER_TEMP/candidate/ExportOptions.plist" release-evidence/ios-production-release/
          cp -R "$RUNNER_TEMP/supporting-evidence" release-evidence/ios-production-release/supporting-evidence

      - name: Retain the verified, authority-bound release evidence package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-production-release-evidence
          if-no-files-found: error
          retention-days: 90
          path: release-evidence/ios-production-release/

      - name: Remove final evidence working copies
        if: always()
        run: rm -rf "$RUNNER_TEMP/final-evidence-inputs"
