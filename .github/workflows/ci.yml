name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history-secrets:
    name: Complete Git history contains no credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out every branch and tag with complete history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the exact mobile Node.js line
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0

      - name: Pin and verify npm
        run: |
          npm install --global npm@11.6.0
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.6.0"
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Reject credentials and forbidden config paths in every Git ref
        run: npm run security:history

  backend-node22:
    name: Backend on deployed Node 22 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up deployed Functions Node.js line
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: backend/functions/.nvmrc
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Verify Functions toolchain
        run: |
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "11.6.0"

      - name: Install backend dependencies
        run: npm --prefix backend/functions ci

      - name: Typecheck, lint, build, and enforce coverage
        run: npm --prefix backend/functions run check

      - name: Reject high-severity and runtime moderate backend advisories
        run: npm --prefix backend/functions run audit:ci

      - name: Set up Java for Firebase Emulator Suite
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run backend emulator safety tests
        run: npm run backend:test:emulator

      - name: Generate backend dependency evidence
        run: |
          mkdir -p release-evidence/backend
          npm --prefix backend/functions sbom --sbom-format=cyclonedx > release-evidence/backend/functions.cdx.json
          node tools/create-evidence-manifest.mjs \
            --base . \
            --label backend-node22-candidate \
            --output release-evidence/backend/sha256-manifest.json \
            backend/functions/package-lock.json \
            backend/functions/lib \
            backend/functions/coverage \
            release-evidence/backend/functions.cdx.json
          test -s release-evidence/backend/sha256-manifest.json

      - name: Retain backend build, coverage, and SBOM evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-node22-candidate-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            backend/functions/package-lock.json
            backend/functions/lib/
            backend/functions/coverage/
            release-evidence/backend/

  android-instrumentation:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Android API 29 instrumentation
            api-level: 29
            target: google_apis
            expected-page-size: '4096'
            artifact-suffix: api29
          - label: Android API 36 instrumentation
            api-level: 36
            target: google_apis
            expected-page-size: '4096'
            artifact-suffix: api36
          - label: Android API 37 16 KB instrumentation
            api-level: 37
            target: google_apis_ps16k
            expected-page-size: '16384'
            artifact-suffix: api37-16kb

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Install mobile dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Android build dependencies
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006'

      - name: Execute the complete Android instrumentation suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: pixel_2
          disable-animations: true
          script: |
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "${{ matrix.expected-page-size }}"
            cd android
            ./gradlew \
              :app:connectedDevDebugAndroidTest \
              -PreactNativeArchitectures=x86_64 \
              --no-configuration-cache

      - name: Retain Android instrumentation reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-${{ matrix.artifact-suffix }}-instrumentation
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/

  android-device-e2e:
    name: Android API 29 isolated UI E2E and production-path smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Install mobile dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Install pinned Android build dependencies
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006'

      - name: Install checksum-verified Maestro
        run: |
          echo "MOBILE_E2E_TOOL_DIR=$RUNNER_TEMP/maestro-cli" >> "$GITHUB_ENV"
          tools/install-maestro.sh "$RUNNER_TEMP/maestro-cli" >/dev/null

      - name: Exercise the isolated fixture and production entry on API 29
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p "$RUNNER_TEMP/mobile-e2e/android" "$RUNNER_TEMP/production-smoke/android"
            npm start -- --reset-cache > "$RUNNER_TEMP/mobile-e2e/android/metro.log" 2>&1 &
            METRO_PID=$!
            trap 'kill "$METRO_PID" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
                break
              fi
              kill -0 "$METRO_PID"
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:8081/status | grep -q 'packager-status:running'
            npm run smoke:fixture:verify | tee "$RUNNER_TEMP/production-smoke/android/fixture-validation.log"
            cd android
            ./gradlew \
              :app:assembleE2eDebug \
              :app:lintE2eDebug \
              :app:compileSmokeDebugKotlin \
              :app:assembleSmokeDebug \
              :app:lintSmokeDebug \
              :app:processSmokeDebugMainManifest \
              :app:processProdReleaseManifest \
              -PreactNativeArchitectures=x86_64 \
              --no-configuration-cache
            cd ..
            for fixture_variant in e2e smoke; do
              generated_services="android/app/build/generated/res/google-services/$fixture_variant"
              if [ -d "$generated_services" ] && \
                [ -n "$(find "$generated_services" -type f -print -quit)" ]; then
                echo "Google Services generated resources leaked into $fixture_variant." >&2
                exit 1
              fi
            done
            npm run e2e:manifest:verify
            npm run smoke:manifest:verify
            adb install -r android/app/build/outputs/apk/e2e/debug/app-e2e-debug.apk
            adb reverse tcp:8081 tcp:8081
            E2E_REPORT_ROOT="$RUNNER_TEMP/mobile-e2e/android/smoke" npm run e2e:android
            adb shell settings put system font_scale 2.0
            adb shell am force-stop com.yashsomani.birthdayautopilot.e2e
            E2E_REPORT_ROOT="$RUNNER_TEMP/mobile-e2e/android/large-text" npm run e2e:android:large-text
            test -s "$RUNNER_TEMP/mobile-e2e/android/smoke/report.xml"
            test -s "$RUNNER_TEMP/mobile-e2e/android/large-text/report.xml"
            adb install -r android/app/build/outputs/apk/smoke/debug/app-smoke-debug.apk
            adb reverse tcp:8081 tcp:8081
            PRODUCTION_SMOKE_REPORT_ROOT="$RUNNER_TEMP/production-smoke/android/large-text" npm run smoke:android
            test -s "$RUNNER_TEMP/production-smoke/android/large-text/report.xml"
            adb shell settings put system font_scale 1.0
            adb shell am force-stop com.yashsomani.birthdayautopilot.smoke
            PRODUCTION_SMOKE_REPORT_ROOT="$RUNNER_TEMP/production-smoke/android/default" npm run smoke:android
            test -s "$RUNNER_TEMP/production-smoke/android/default/report.xml"

      - name: Retain Android device E2E evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-api29-isolated-ui-e2e
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/mobile-e2e/android/
            android/app/build/outputs/apk/e2e/debug/app-e2e-debug.apk
            android/app/build/intermediates/merged_manifests/e2eDebug/
            android/app/build/intermediates/merged_manifests/prodRelease/

      - name: Retain Android production-path smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-api29-production-path-smoke
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/production-smoke/android/
            ${{ runner.temp }}/mobile-e2e/android/metro.log
            android/app/build/outputs/apk/smoke/debug/app-smoke-debug.apk
            android/app/build/intermediates/merged_manifests/smokeDebug/
            e2e/production-smoke/production-smoke-projections.json

  quality-and-android:
    name: Quality and Android dev artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/functions/package-lock.json
            backend/hosting/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Verify JavaScript toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.6.0"

      - name: Install mobile dependencies
        run: npm ci

      - name: Install server and public-site dependencies
        run: |
          npm --prefix backend/functions ci
          npm --prefix backend/hosting ci

      - name: Validate the fail-closed store-submission template
        run: npm run store:template:check

      - name: Run mobile and control-plane checks
        run: npm run check:portable

      - name: Reject committed credentials and misplaced client configs
        run: npm run security:secrets

      - name: Reject high-severity dependency advisories
        run: |
          npm audit --audit-level=high
          npm audit --prefix backend/functions --audit-level=high
          npm audit --prefix backend/functions --omit=dev --audit-level=moderate
          npm audit --prefix backend/hosting --audit-level=high

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006'

      - name: Verify Android toolchain
        run: npm run doctor:android

      - name: Run backend emulator safety tests
        run: npm run backend:test:emulator

      - name: Test, lint, and assemble Android dev
        working-directory: android
        run: >-
          ./gradlew
          :app:testDevDebugUnitTest
          :app:testDevDebugOptimizedUnitTest
          :app:testDevReleaseUnitTest
          :app:testStagingDebugUnitTest
          :app:testStagingDebugOptimizedUnitTest
          :app:testStagingReleaseUnitTest
          :app:testLabReleaseUnitTest
          :app:testProdReleaseUnitTest
          :app:testE2eDebugUnitTest
          :app:compileDevDebugAndroidTestKotlin
          :app:compileStagingDebugAndroidTestKotlin
          :app:assembleDevDebugAndroidTest
          :app:assembleStagingDebugAndroidTest
          :app:lintDevDebug
          :app:lintDevRelease
          :app:lintStagingDebug
          :app:lintStagingRelease
          :app:lintLabRelease
          :app:lintProdRelease
          :app:lintE2eDebug
          :app:assembleDevDebug
          :app:assembleDevRelease
          :app:assembleStagingDebug
          :app:assembleStagingRelease
          :app:assembleE2eDebug
          --no-configuration-cache

      - name: Verify the unrestricted Android artifact
        run: |
          tools/verify-android-apk.sh \
            android/app/build/outputs/apk/dev/debug/app-dev-debug.apk \
            com.yashsomani.birthdayautopilot.dev
          tools/verify-android-apk.sh \
            android/app/build/outputs/apk/dev/release/app-dev-release-unsigned.apk \
            com.yashsomani.birthdayautopilot.dev \
            --unsigned-dev-release

      - name: Generate mobile and Hosting dependency evidence
        run: |
          mkdir -p release-evidence/mobile
          npm sbom --sbom-format=cyclonedx > release-evidence/mobile/mobile.cdx.json
          npm --prefix backend/hosting sbom --sbom-format=cyclonedx > release-evidence/mobile/hosting.cdx.json
          node tools/generate-native-sbom.mjs \
            --kind gradle \
            --lock android/app/gradle.lockfile \
            --output release-evidence/mobile/android-complete-graph.cdx.json \
            --application-name Birthday-Autopilot-Android-Complete-Graph \
            --version 1.0
          node tools/generate-native-sbom.mjs \
            --kind gradle \
            --lock android/app/gradle.lockfile \
            --configuration prodReleaseRuntimeClasspath \
            --output release-evidence/mobile/android-prod-runtime.cdx.json \
            --application-name Birthday-Autopilot-Android-Prod-Runtime \
            --version 1.0
          node tools/generate-native-sbom.mjs \
            --kind gradle \
            --lock android/buildscript-gradle.lockfile \
            --output release-evidence/mobile/android-build-plugins-native.cdx.json \
            --application-name Birthday-Autopilot-Android-Build-Plugins \
            --version 1.0
          node tools/scan-native-vulnerabilities.mjs \
            --dependency-set \
              android-complete-graph \
              gradle \
              android/app/gradle.lockfile \
              release-evidence/mobile/android-complete-graph.cdx.json \
            --dependency-set \
              android-prod-runtime \
              gradle \
              android/app/gradle.lockfile \
              release-evidence/mobile/android-prod-runtime.cdx.json \
            --dependency-set \
              android-build-plugins \
              gradle \
              android/buildscript-gradle.lockfile \
              release-evidence/mobile/android-build-plugins-native.cdx.json \
            --output release-evidence/mobile/android-native-osv.json
          node tools/verify-javascript-licenses.mjs --output release-evidence/mobile/javascript-licenses.json
          node tools/create-evidence-manifest.mjs \
            --base . \
            --label mobile-android-candidate \
            --output release-evidence/mobile/sha256-manifest.json \
            package-lock.json \
            backend/hosting/package-lock.json \
            android/app/gradle.lockfile \
            android/buildscript-gradle.lockfile \
            android/settings-gradle.lockfile \
            android/gradle/verification-metadata.xml \
            android/app/build/outputs/apk/dev \
            android/app/build/reports \
            backend/hosting/public \
            coverage \
            release-evidence/mobile/mobile.cdx.json \
            release-evidence/mobile/hosting.cdx.json \
            tools/native-advisory-exceptions.json \
            release-evidence/mobile/android-complete-graph.cdx.json \
            release-evidence/mobile/android-prod-runtime.cdx.json \
            release-evidence/mobile/android-build-plugins-native.cdx.json \
            release-evidence/mobile/android-native-osv.json \
            release-evidence/mobile/javascript-licenses.json
          test -s release-evidence/mobile/sha256-manifest.json

      - name: Retain Android artifacts, reports, coverage, and SBOM evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mobile-android-candidate-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            package-lock.json
            backend/hosting/package-lock.json
            android/app/gradle.lockfile
            android/buildscript-gradle.lockfile
            android/settings-gradle.lockfile
            android/gradle/verification-metadata.xml
            android/app/build/outputs/apk/dev/
            android/app/build/reports/
            backend/hosting/public/
            coverage/
            release-evidence/mobile/

  release-admission:
    name: Release admission for exact source SHA
    if: ${{ always() }}
    needs:
      - history-secrets
      - backend-node22
      - android-instrumentation
      - android-device-e2e
      - quality-and-android
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Require every CI dependency to succeed
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq 'length' <<< "$REQUIRED_JOB_RESULTS")" = 5
          jq -e 'all(.[]; .result == "success")' <<< "$REQUIRED_JOB_RESULTS" > /dev/null
