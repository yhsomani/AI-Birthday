name: CI / Release Pipeline

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-quality-and-test:
    name: Flutter Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.6'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: flutter analyze

      - name: Run Flutter Test Suite
        # Golden tests are a local-only gate (tagged `golden`); regenerate with
        # `flutter test --update-goldens test/ui/goldens` and review the PNGs.
        run: flutter test --coverage --exclude-tags golden

      - name: Build Play Store Android Release APK (unsigned CI artifact)
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: flutter build apk --flavor play --release --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY"

      - name: Verify Play Store Manifest Excludes SEND_SMS
        run: |
          if grep -q "android.permission.SEND_SMS" build/app/intermediates/merged_manifests/playRelease/processPlayReleaseManifest/AndroidManifest.xml 2>/dev/null || grep -q "android.permission.SEND_SMS" build/app/intermediates/merged_manifests/playRelease/AndroidManifest.xml 2>/dev/null; then
            echo "ERROR: SEND_SMS permission was found in the Play Store release manifest!"
            exit 1
          fi
          echo "Play Store manifest verified: no SEND_SMS permission."

      - name: Build Personal Sideload Android Release APK
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: flutter build apk --flavor personal --release --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY"

      - name: Upload Play Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-play-release-apk
          path: build/app/outputs/flutter-apk/app-play-release.apk
          if-no-files-found: error

      - name: Upload Personal Sideload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-personal-release-apk
          path: build/app/outputs/flutter-apk/app-personal-release.apk
          if-no-files-found: error


  backend-verification:
    name: Backend Security & Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # Production dependencies must have no high or critical advisories (audit F24).
      # Dev-only advisories are reported in the audit output but do not block.
      - name: Production Dependency Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install Java for Firebase Emulator
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Lint Check
        run: npm run lint

      - name: TypeScript Compile Check
        run: npm run build

      - name: Run Vitest Suite
        run: npm test

      - name: Run Firestore Emulator Tests
        run: npm run test:emulator

  hosting-verification:
    name: Public Site & Account Deletion Hosting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/hosting
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/hosting/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck, Test & Production Build
        run: npm run check

