name: React Native CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: react-native-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 17 for Expo Android compilation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Activate exact npm from packageManager
        run: |
          corepack enable npm
          test "$(npm --version)" = "11.6.0"

      - name: Install exact dependencies
        run: npm ci

      - name: Prove clean checkout has no generated release report
        run: test ! -e reports/react-native-release-evidence.json

      - name: Execute release gates and generate command-derived source-only evidence
        run: node --import tsx src/config/releaseEvidenceCli.ts --source-only --fail-on-blockers

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: react-native-source-evidence-${{ github.sha }}
          path: reports/react-native-release-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest release evidence provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: reports/react-native-release-evidence.json
